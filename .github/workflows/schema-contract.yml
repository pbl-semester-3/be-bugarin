name: Schema Contract (Backend)

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate kontrak
        run: npm run schema:export
      - name: Pastikan contract/schema-contract.json diperbarui
        run: git diff --exit-code contract/schema-contract.json
