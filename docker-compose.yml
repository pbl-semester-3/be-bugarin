services:
  mysql:
    image: mysql:8.4
    container_name: bugarin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: bugarin_root_dev
      MYSQL_DATABASE: bugarin_dev
      MYSQL_USER: bugarin
      MYSQL_PASSWORD: bugarin_dev
    ports:
      - "3307:3306"
    volumes:
      - bugarin_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbugarin_root_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugarin_mysql_data:
